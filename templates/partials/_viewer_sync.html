<section class="viewer-sync" data-viewer-sync="{{ campaign.id }}" aria-label="Viewer synchronization">
  <h3>Viewer synchronization</h3>
  <p class="muted small" data-sync-summary role="status">Checking displays…</p>
  <ul data-sync-list class="small"></ul>
  <p class="muted small">Per connection, not per account; reconnects may leave a recent disconnected row. Up to date means the viewer reports the current image loaded, not proof the physical screen is visible.</p>
  <noscript>Enable JavaScript for live synchronization status.</noscript>
</section>
