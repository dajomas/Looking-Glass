<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ app_title }}{% endblock %} · {{ app_title }}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/common.css">
  {% block styles %}{% endblock %}
</head>
<body class="entry-{{ entry }} {% block body_class %}{% endblock %}">
{% block header %}
  {% include "partials/_nav.html" %}
{% endblock %}
{% include "partials/_campaign_quick_nav.html" %}
<main class="{% block main_class %}container{% endblock %}">
  {% include "partials/_flash.html" %}
  {% block content %}{% endblock %}
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/upload_busy.js?v=imports-7-1"></script>
{% block scripts %}{% endblock %}
</body>
</html>
