[pytest]
# Run with: python -m pytest -c e2e/pytest.ini e2e   (tools/run_e2e.sh does this)
testpaths = .
addopts =
    -p no:cacheprovider
    --browser chromium
    --browser firefox
    --screenshot only-on-failure
    --tracing retain-on-failure
    --video off
markers =
    e2e: Playwright end-to-end journey against a real local Looking Glass server
